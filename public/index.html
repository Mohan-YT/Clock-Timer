<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="clock.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Modak&family=Spicy+Rice&display=swap" rel="stylesheet">
</head>
<body id="body">
    <main>
                <!-- CLOCK -->
                <section class="Clock"  id="clock">
                   <div class="clock-box m-2" >
                              <!-- wall-clock -->
                        <div class="wall-clock mb-5 mb-md-3">
                            <div class="clock-sec">
                                <div class="sec" id="sec"></div>
                            </div>
                            <div class="clock-mins">
                                <div class="mns" id="mns"></div>
                            </div>
                            <div class="clock-hours">
                                <div class="hr" id="hr"></div>
                                </div>
                                    <div class="nums nums-1">|</div>
                                    <div class="nums nums-2">|</div>
                                    <div class="nums nums-3">3</div>
                                    <div class="nums nums-4">|</div>
                                    <div class="nums nums-5">|</div>
                                    <div class="nums nums-6">6</div>
                                    <div class="nums nums-7">|</div>
                                    <div class="nums nums-8">|</div>
                                    <div class="nums nums-9">9</div>
                                    <div class="nums nums-10">|</div>
                                    <div class="nums nums-11">|</div>
                                    <div class="nums nums-12">12</div>
                                
                        </div>
                    
                                 <!-- digital-clock -->
                    <div class="digital-clock text-center mt-4 mt-md-1 pb-md-1">
                            <h1 id="clock-num">
                                <span id="span1"></span> :
                                <span id="span2"></span> :
                                <span id="span3"></span> 
                                <span id="period"></span>
                            </h1>
                        <button class="btn mt-2 fs-5 mt-3 " onclick="change24H()" id="change24H">12-Hours</button>
                    </div>
                   </div>
                </section>
                <!-- STOPWATCH -->
                <section id="Stopwatch" class="stopwatch">
                   <div class="stop-box m-2">
                    <h1 id="runTimer">00:00:00:00</h1>
                    <!-- Time Lap -->
                     <div class="timeLap-main" id="timeLap-main">
                        <table>
                            <thead>
                                <tr>
                                    <th>Lap</th>
                                    <th>Lap times</th>
                                    <th>Total time</th>
                                </tr>
                            </thead>
                        </table>
                        <div class="timeLap-main-body">
                            <table>
                               <tbody></tbody> 
                            </table>
                         </div>
                     </div>
                    
                    <div class="d-flex gap-2 mt-3">
                        
                        <button class="btn" id="lap">Lap</button>

                        <button class="btn" id="start" >Start</button>

                        <button class="btn" id="stop" >Stop</button>

                        <button class="btn" id="reset" >Reset</button>

                        <button class="btn" id="resume" >Resume</button>
                    </div>
                   </div>
                </section>
    </main>
    <nav>
        <button class="btn"><a href="#clock">Clock</a></button>
        <button class="btn"><a href="#Stopwatch">StopWatch</a>
        </button>
     </nav>
</body>
<script src="clock.js"></script>
</html>
